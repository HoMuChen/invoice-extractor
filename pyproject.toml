[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Turn a folder of invoice PDFs into a validated Excel workbook with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "reportlab>=4.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
